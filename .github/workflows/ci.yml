# CI NotesCam — garde-fous qui tournaient jusqu'ici seulement « si on y pensait ».
#
# Ordre volontaire, du moins cher au plus cher : les validations statiques (sans
# base, quelques secondes) avant les 176 tests, puis le build. Un echec arrete la
# suite — inutile de construire si les migrations sont dangereuses.
#
# `npm test` applique le cliquet des echecs connus (`ECHECS_CONNUS` dans
# scripts/run-tests.mjs) : un defaut deja documente dans PROJECT_STATUS.md ne
# bloque pas, tout echec nouveau bloque.
#
# Aucun secret n'est utilise : rien ici ne touche Supabase ni Vercel, et aucun
# job ne deploie. Le deploiement reste declenche par Vercel sur `main`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Node 24 (version de developpement du projet)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Coherence de la synchronisation
        run: npm run validate

      - name: Surete et idempotence des migrations
        run: npm run validate:migrations

      # POURQUOI CETTE ETAPE EXISTE
      # `server/_license_machine.test.mjs` signe de vraies licences pour verifier
      # le verrou machine, l'expiration et le refus d'une cle alteree. Il lui faut
      # donc la cle privee de l'editeur — `packaging/license/private-key.pem`,
      # gitignoree (.gitignore:55), donc ABSENTE de tout checkout neuf. Et
      # `npm test` sort en code 1 des un echec non declare : la CI ne pouvait pas
      # passer, quel que soit le code pousse. Mesure le 2026-10-21 sur un worktree
      # neuf : 170 ok / 1 ko, l'unique echec etant « Cle privee introuvable » ;
      # la cle fournie, ce test passe 13/13.
      #
      # On fabrique donc une paire JETABLE, valable le temps du job. Le test
      # verifie une LOGIQUE, pas une cle particuliere : signer avec une paire
      # d'emprunt l'exerce aussi bien, et aucun secret n'entre dans le depot.
      #
      # La condition compte : keygen refuse d'ecraser une cle existante sans
      # --force, et c'est une protection qu'on ne contourne pas. Si quelqu'un
      # rejoue ce workflow sur une machine qui porte la vraie cle, l'etape ne
      # fait rien plutot que d'invalider les licences deja emises.
      - name: Cle de licence jetable (la vraie est gitignoree, donc absente ici)
        run: |
          if [ -f packaging/license/private-key.pem ]; then
            echo "Une cle privee est deja presente : on n'y touche pas."
          else
            node packaging/license/keygen.mjs
          fi

      - name: Tests colocalises (193)
        run: npm test

      # keygen a REECRIT `server/license-pubkey.txt`, qui est versionnee et
      # LIVREE dans l'application : c'est elle qui valide les licences chez les
      # ecoles. On la remet donc telle qu'elle est dans le depot AVANT les
      # builds. Sans cela, les paquets construits ici porteraient la clef
      # publique d'emprunt — inoffensif tant que ce job ne deploie pas, mais le
      # jour ou quelqu'un y branche un deploiement, toutes les licences
      # existantes seraient refusees. On ferme le piege maintenant.
      - name: Rendre sa cle publique au depot (les builds doivent livrer la vraie)
        run: |
          git checkout -- server/license-pubkey.txt
          git diff --exit-code -- server/license-pubkey.txt

      - name: Build edition cloud
        run: npm run build

      - name: Build edition LAN
        run: npm run build:lan
